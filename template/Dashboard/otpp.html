<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
{% load static %}
<body class="d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 text-center" style="width: 300px;">
    <h5 class="mb-3">Enter OTP</h5>

    <!-- OTP input boxes -->
    <div class="d-flex justify-content-center gap-2 mb-3">
      <input type="text" maxlength="1" class="otp-input form-control text-center fs-4" style="width:60px; height:60px;">
      <input type="text" maxlength="1" class="otp-input form-control text-center fs-4" style="width:60px; height:60px;">
      <input type="text" maxlength="1" class="otp-input form-control text-center fs-4" style="width:60px; height:60px;">
      <input type="text" maxlength="1" class="otp-input form-control text-center fs-4" style="width:60px; height:60px;">
    </div>

    <!-- Timer and resend link -->
    <p id="timerText" class="mb-2 text-muted">Resend available in 30s</p>
    <button id="resendBtn" class="btn btn-link" disabled>Resend Code</button>

    <!-- Verify button -->
    <button id="verifyBtn" class="btn btn-primary w-100 mt-3">Verify</button>
  </div>

  <!-- JS file -->
  <script src="{% static 'Dashboard/js/otp_verification.js' %}"></script>
</body>
</html>
