<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/product_dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  </head>
  <style>
    .cart-badge {
  position: absolute;
  top: -8px;
  right: -10px;
  background-color: red;
  color: white;
  border-radius: 50%;
  font-size: 12px;
  padding: 2px 6px;
  font-weight: bold;
}

  </style>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" >    
      <div class="container d-flex align-items-center">
        <div class="me-3 text-white d-flex align-items-center">
          <i class="bi bi-house-door-fill fs-4"></i>
        </div>
        <a class="navbar-brand text-white fs-3" href="#">Dressify</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          
        
          <form class="d-flex mx-auto">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" style="width:400px;">
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>
        </div> 
      </div>
      <div class="d-flex align-items-center position-relative text-white">
        <i class="bi bi-cart3 fs-4 position-relative"> <span class="cart-badge">0</span></i>
      </div>

        <div class="dropdown ms-3 d-none d-lg-block" >

          <img src="../images/profile.jpg" class="dropdown-toggle" id="profileDropdowm" data-bs-toggle="dropdown" aria-expanded="false" style="cursor: pointer; width: 30px; height: 30px;border-radius: 50%; margin-right: 30px;">

            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuLink">
              <li><a class="dropdown-item" href="#">umair@gmail.com</a></li>
              <li><a class="dropdown-item" href="#">Password Reset</a></li>
              <li><a class="dropdown-item" href="#">Logout</a></li>
            </ul>
        </div>

    </nav> 
<div class="container">
    <div class="row py-3 gy-3" id="products-container">

    </div>
</div>
<script>
  // Fetch products from your DRF backend
  fetch("http://127.0.0.1:8000/get_products/")
    .then(response => response.json())
    .then(data => {
      let container = document.getElementById("products-container");

      data.forEach(product => {
        let col = document.createElement("div");
        col.classList.add("col-md-4");
        col.innerHTML = `
          <div class="card">
            <img src="http://127.0.0.1:8000/get_product_image/?prod_id=${product.id}" 
                 class="card-img-top" alt="${product.name}" 
                 style="object-fit: contain;" height="175px">
            <div class="card-body">
              <h5 class="card-title">${product.name}</h5>
              <p class="card-text">${product.description || ""}</p>
              <p><strong>$${product.price}</strong></p>
              <button class="btn btn-dark add-to-cart-btn" data-id="${product.id}"> Add To Cart
              </button>
            </div>
          </div>
        `;
        container.appendChild(col);
      });
      document.querySelectorAll(".add-to-cart-btn").forEach(button => {
      button.addEventListener("click", async function() {
        const productId = this.getAttribute("data-id");

        try {
          const response = await fetch("http://127.0.0.1:8000/api/cart/", {
            method: "POST",
            body: JSON.stringify({
              product_id: productId,
              quantity: 1
            })
          });

          const data = await response.json();

          if (response.ok) {
            console.log("Product added:", data);

            // ✅ Update cart badge dynamically
            updateCartBadge();

          } else {
            console.error("Failed to add product:", data);
          }

        } catch (error) {
          console.error("Error adding to cart:", error);
        }
      });
    });

    // ✅ Load initial cart count when page loads
    updateCartBadge();
    })
    .catch(error => console.error("Error loading products:", error));
    function updateCartBadge() {
      fetch("http://127.0.0.1:8000/api/cart/", {
        // headers: {
        //   "Authorization": `Bearer ${localStorage.getItem("access_token")}`
        // }
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.cart_items) {
          cartBadge.textContent = data.cart_items.length;
        } else {
          cartBadge.textContent = 0;
        }
      })
      .catch(err => {
        console.error("Error fetching cart count:", err);
        cartBadge.textContent = 0;
      });
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
