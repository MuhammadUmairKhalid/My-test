<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up - MenStyle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">MenStyle</a>
    </div>
  </nav>

  <!-- Signup Form -->
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
      <h3 class="text-center mb-4">Create Account</h3>
      
      <!-- Prevent form reload -->
      <form onsubmit="signupUser(event)">
        <div class="mb-3">
          <input type="text" id="username" class="form-control" placeholder="Full Name" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Sign Up</button>
      </form>

      <p class="text-center mt-3">Already have an account? 
        <a href="{% url 'loginn' %}">Login</a>
      </p>
    </div>
  </div>

  <!-- Your JS file -->
  <script src="{% static 'Dashboard/js/signup.js' %}"></script>

</body>
</html>
